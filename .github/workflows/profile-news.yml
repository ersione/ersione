name: Refresh profile news from API

on:
  schedule:
    # 04:00 Asia/Seoul, once per day (19:00 UTC on the previous day).
    # GitHub may delay scheduled runs.
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_readme.py
      - tests/test_update_readme.py
      - .github/workflows/profile-news.yml
  pull_request:
    paths:
      - scripts/update_readme.py
      - tests/test_update_readme.py
      - .github/workflows/profile-news.yml

permissions:
  contents: read

concurrency:
  group: profile-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests -v

  refresh:
    needs: test
    if: github.repository == 'ersione/ersione' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Refresh text links and immutable release badges
        # A failed API or badge request stops this job before staging or committing.
        run: python3 scripts/update_readme.py
      - name: Commit only changed news and badge assets
        run: |
          git add -- README.md assets/news
          if git diff --cached --quiet; then
            echo 'No profile news changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): refresh news and release badges'
          git push origin HEAD:main
